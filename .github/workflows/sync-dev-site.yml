name: Sync dev site

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-dev-site
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4
        with:
          path: staging

      - name: Checkout website dev branch
        uses: actions/checkout@v4
        with:
          repository: Kitsune-Innovation-Labs/website
          ref: dev
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/kitsuneos/package-lock.json

      - name: Build KitsuneOS
        working-directory: source/kitsuneos
        run: |
          npm ci
          npm run build

      - name: Assemble staging site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp source/index.html _site/
          cp -a source/assets _site/
          cp -a source/charter _site/
          cp -a source/design _site/

          if [ -d source/gametable ]; then
            cp -a source/gametable _site/
          fi

          mkdir -p _site/kitsuneos
          cp -a source/kitsuneos/dist/. _site/kitsuneos/

          printf '%s\n' 'dev.kitsunelabs.nz' > _site/CNAME

      - name: Publish assembled site to staging repository
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            _site/ staging/

          cd staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No staging changes to publish.'
            exit 0
          fi

          git commit -m 'Sync website dev branch'
          git push origin main
